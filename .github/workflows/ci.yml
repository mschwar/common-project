name: CI - Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate concepts.json
        run: |
          python -c "import json; json.load(open('docs/concepts.json'))"
          echo "concepts.json is valid JSON"

      - name: Check required files
        run: |
          test -f docs/index.html && echo "index.html exists"
          test -f docs/script.js && echo "script.js exists"
          test -f docs/styles.css && echo "styles.css exists"
          test -f docs/concepts.json && echo "concepts.json exists"
